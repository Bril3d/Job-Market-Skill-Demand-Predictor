name: Job Demand Predictor CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Mock model artifacts
        run: |
          mkdir -p models data
          uv run python -c "
          import joblib, json, pandas as pd
          from sklearn.linear_model import LogisticRegression
          from sklearn.pipeline import Pipeline
          from sklearn.compose import ColumnTransformer
          from sklearn.preprocessing import OneHotEncoder
          from sklearn.feature_extraction.text import TfidfVectorizer

          prep = ColumnTransformer([
              ('title_tfidf', TfidfVectorizer(max_features=200, stop_words='english'), 'title'),
              ('cat', OneHotEncoder(handle_unknown='ignore'), ['seniority', 'category', 'geo_tier']),
              ('num', 'passthrough', ['years_exp'])
          ], remainder='drop')

          data = [{
              'title': f'Job Title {i} Engineer',
              'seniority': 'Senior' if i % 2 == 0 else 'Junior',
              'category': 'ML Engineering' if i % 2 == 0 else 'Others',
              'geo_tier': 'Tier 1' if i % 2 == 0 else 'Tier 2',
              'years_exp': i % 10,
              'demand_label': 1 if i % 2 == 0 else 0
          } for i in range(100)]
          df = pd.DataFrame(data)
          df.to_csv('data/features_jobs.csv', index=False)

          model = Pipeline([('preprocessor', prep), ('classifier', LogisticRegression(random_state=42))])
          model.fit(df[['title', 'seniority', 'category', 'geo_tier', 'years_exp']], df['demand_label'])

          joblib.dump(model, 'models/demand_model.joblib')
          joblib.dump(model.named_steps['preprocessor'].named_transformers_['title_tfidf'], 'models/title_tfidf.joblib')

          with open('models/threshold.json', 'w') as f:
              json.dump({'threshold': 0.5181}, f)

          metrics = {
              'model_name': 'Logistic Regression',
              'accuracy': 0.8462,
              'precision': 0.8824,
              'recall': 0.8182,
              'f1_high': 0.8491,
              'macro_f1': 0.8461,
              'roc_auc': 0.9373,
              'best_threshold': 0.5181,
              'confusion_matrix': [[43, 6], [10, 45]],
              'leakage_free': True,
              'threshold_selection': 'training_cv_only'
          }
          with open('data/evaluation_metrics.json', 'w') as f:
              json.dump(metrics, f, indent=4)
          "

      - name: Run API tests
        run: uv run pytest tests/ -v --tb=short
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          PYTHONPATH: .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check code/ tests/
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mock model artifacts for build
        run: |
          mkdir -p models data
          python3 -c "import os; open('models/demand_model.joblib', 'a').close(); open('models/title_tfidf.joblib', 'a').close(); open('models/threshold.json', 'a').close(); open('data/features_jobs.csv', 'a').close()"

      - name: Lowercase repo owner for Docker
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/job-demand-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/job-demand-frontend:latest
