name: Job Demand Predictor CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Mock model artifacts
        run: |
          mkdir -p models data
          # Mock TF-IDF with exactly 200 features
          uv run python -c "import joblib; from sklearn.feature_extraction.text import TfidfVectorizer; tfidf = TfidfVectorizer(max_features=200); tfidf.fit([' '.join([f'word_{i}' for i in range(200)])]); joblib.dump(tfidf, 'models/title_tfidf.joblib')"
          # Mock Model with correct feature count
          uv run python <<EOF
          import joblib; import pandas as pd; import numpy as np; from sklearn.ensemble import RandomForestClassifier; from sklearn.pipeline import Pipeline; from sklearn.compose import ColumnTransformer; from sklearn.preprocessing import OneHotEncoder;
          cols = ['seniority', 'category', 'geo_tier', 'years_exp', 'has_ai', 'has_cloud', 'has_backend', 'has_frontend'] + [f'title_tfidf_{i}' for i in range(200)]
          df = pd.DataFrame([['Mid-Level', 'Others', 'Tier 2', 0, 0, 0, 0, 0] + [0.0]*200], columns=cols)
          preprocessor = ColumnTransformer([('cat', OneHotEncoder(handle_unknown='ignore'), ['seniority', 'category', 'geo_tier'])], remainder='passthrough')
          clf = Pipeline([('pre', preprocessor), ('clf', RandomForestClassifier(n_estimators=1))])
          clf.fit(df, [1])
          joblib.dump(clf, 'models/demand_model.joblib')
          EOF
          echo '{"threshold": 0.5}' > models/threshold.json
          echo '{"accuracy": 0.9, "precision": 0.9, "recall": 0.9, "f1_high": 0.9, "roc_auc": 0.9, "best_threshold": 0.5}' > data/evaluation_metrics.json
          echo "title,seniority,category,geo_tier,years_exp,has_ai,has_cloud,has_backend,has_frontend,demand_label" > data/features_jobs.csv

      - name: Run API tests
        run: uv run pytest tests/ -v --tb=short
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          PYTHONPATH: .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check code/ tests/
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Mock model artifacts for build
        run: |
          mkdir -p models data
          python3 -c "import os; open('models/demand_model.joblib', 'a').close(); open('models/title_tfidf.joblib', 'a').close(); open('models/threshold.json', 'a').close(); open('data/features_jobs.csv', 'a').close()"

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t job-demand-backend .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t job-demand-frontend ./frontend
